name: ci
on:
  push:
    branches: [debate, motion, decree]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    # A fixed image: a release built on a newer one could need a newer glibc than users have.
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned to a commit (the version beside it), and no dependency cache: a build
      # trusts nothing it did not fetch and check itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: TypeScript tests
        run: npm test
      - name: Dashboard build and tests
        run: npm run build -w apps/dashboard && npm test -w apps/dashboard
      - name: Rust build (no warnings allowed)
        run: RUSTFLAGS="-D warnings" cargo build --release --locked
      - name: Rust tests
        run: cargo test --release --locked
      - name: Sandbox self-test
        # The self-test needs Landlock ABI 6 (kernel 6.12+). Hosted runners may be older:
        # then govern-sup refuses to run at all (fail closed), which we report, not hide.
        run: |
          set +e
          out=$(./target/release/govern-sup selftest 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -q "needs Landlock ABI"; then
            echo "::warning::runner kernel too old for the sandbox self-test; govern-sup correctly refused to start"
            exit 0
          fi
          exit $code
