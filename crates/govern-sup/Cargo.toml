[package]
name = "govern-sup"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "GovernCode's sandbox supervisor: runs an AI tool under Landlock + seccomp"
publish = false

[dependencies]
landlock = "0.4.7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
libc = "0.2"

# Native fixture helpers are deliberately absent from ordinary builds and packaging.
[features]
probe-lifetime-fixtures = []

[[bin]]
name = "probe-lifetime-driver"
path = "tests/fixtures/probe_lifetime_driver.rs"
required-features = ["probe-lifetime-fixtures"]
test = false

[[test]]
name = "probe_lifetime"
path = "tests/probe_lifetime.rs"
required-features = ["probe-lifetime-fixtures"]
